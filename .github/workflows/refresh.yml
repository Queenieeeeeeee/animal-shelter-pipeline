name: Refresh shelter data

on:
  schedule:
    - cron: "23 11 1 * *"     # 1st of each month, 11:23 UTC
  workflow_dispatch:
    inputs:
      skip_extract:
        description: "Only reload BigQuery from the snapshots already in the repo"
        type: boolean
        default: false
      allow_shrink:
        description: "Accept a snapshot smaller than the previous one"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job commit new snapshots back to the repo

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  GCP_PROJECT: animal-shelter-pipeline

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract full snapshot
        if: ${{ !inputs.skip_extract }}
        run: |
          if [ "${{ inputs.allow_shrink }}" = "true" ]; then
            python extract.py --allow-shrink
          else
            python extract.py
          fi

      - name: Commit new snapshot
        if: ${{ !inputs.skip_extract }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      # Signs in to Google Cloud as the github-actions-loader service account,
      # using the key stored in the GCP_SA_KEY repository secret.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Load into BigQuery
        run: python load.py
