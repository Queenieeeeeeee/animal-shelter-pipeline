name: Refresh shelter data

on:
  schedule:
    - cron: "23 11 1 * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-pull every source from the beginning"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract
        run: |
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            python extract.py --full-refresh
          else
            python extract.py
          fi

      - name: Commit new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "No new records."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
